name: demo

# Builds the native program, then compiles the same source against Emscripten's
# SDL2 port and publishes the page to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'web/**', 'Makefile', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build natively
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsdl2-dev
          make
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build demo
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
